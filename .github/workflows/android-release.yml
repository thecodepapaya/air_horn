name: Android Release Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  signed-aab:
    name: Test and build signed AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          pubspec_version=$(awk '/^version:/ { print $2; exit }' pubspec.yaml)
          release_version=${pubspec_version%%+*}
          if [[ "$GITHUB_REF_NAME" != "v$release_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match pubspec version $release_version" >&2
            exit 1
          fi

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Restore Android signing files
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEY_PROPERTIES_B64: ${{ secrets.ANDROID_KEY_PROPERTIES_B64 }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_B64:?Missing ANDROID_KEYSTORE_B64}"
          : "${ANDROID_KEY_PROPERTIES_B64:?Missing ANDROID_KEY_PROPERTIES_B64}"
          install -m 600 /dev/null android/app/upload-keystore.jks
          install -m 600 /dev/null android/key.properties
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 --decode > android/app/upload-keystore.jks
          printf '%s' "$ANDROID_KEY_PROPERTIES_B64" | base64 --decode > android/key.properties

      - name: Build signed Android App Bundle
        run: flutter build appbundle --release

      - name: Upload signed AAB
        uses: actions/upload-artifact@v7
        with:
          name: air-horn-${{ github.sha }}
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Remove signing files
        if: always()
        run: |
          rm -f android/app/upload-keystore.jks
          rm -f android/key.properties

  github-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: signed-aab
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download signed AAB
        uses: actions/download-artifact@v8
        with:
          name: air-horn-${{ github.sha }}
          path: release

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -s release/app-release.aab
          release_version=${GITHUB_REF_NAME#v}
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/app-release.aab \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/app-release.aab \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "Air Horn $release_version" \
              --generate-notes
          fi
